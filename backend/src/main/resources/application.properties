spring.application.name=BackendServer

# MySQL datasource - replace values as needed
spring.datasource.url=jdbc:mysql://localhost:3306/astronomy?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (automatically create/update schema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# NASA API (register at https://api.nasa.gov for higher rate limits)
nasa.api.key=DEMO_KEY

# 通义千问 DashScope（OpenAI 兼容模式，Key 从环境变量 DASHSCOPE_API_KEY 读取）
spring.config.import=optional:classpath:application-local.properties
deepseek.api.key=${DASHSCOPE_API_KEY:}
deepseek.api.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
deepseek.model=qwen-plus
